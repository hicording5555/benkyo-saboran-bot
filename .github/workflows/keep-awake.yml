# Render の無料 Web サービスは約15分アクセスがないとスリープする。
# 起動に20秒ほどかかり、LINE の Webhook はそこまで待たない。
# GitHub の schedule は遅れることがあるので、15分ぎりぎりではなく5分ごとに起こす。
name: Keep Render awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: GET homepage
        run: |
          set -euo pipefail
          body="$(mktemp)"
          curl_status=0
          http_code="$(
            curl --silent --show-error --location \
              --max-time 60 \
              --output "$body" \
              --write-out "%{http_code}" \
              "https://benkyo-saboran-bot.onrender.com/"
          )" || curl_status=$?
          echo "HTTP ${http_code:-000} (curl exit ${curl_status})"
          cat "$body"
          echo
          test "${http_code:-000}" = "200"
